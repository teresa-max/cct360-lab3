<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Behind the Performance</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>Behind the Performance</h1>

      <div class="sequence">
        <img
          id="image1"
          src="images/rest.jpg"
          alt="A dancer sitting with her head lowered"
        />
        <img
          id="image2"
          src="images/shoes.jpg"
          alt="A dancer adjusting her pointe shoes"
        />
        <img
          id="image3"
          src="images/stage.jpg"
          alt="A dancer performing under stage lights"
        />
      </div>

      <div aria-live="polite">
        <h2 id="story-title">Finding Courage</h2>
        <p id="story-description">
          From a quiet moment to preparation, then stepping into the spotlight.
        </p>
      </div>

      <div class="controls">
        <button id="sequence-one" type="button">Finding Courage</button>
        <button id="sequence-two" type="button">After the Applause</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
